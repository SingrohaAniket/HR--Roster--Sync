services:

  mysql:
    image: mysql:8.4
    container_name: roster-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: roster
      MYSQL_USER: roster
      MYSQL_PASSWORD: rosterpass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=300
      - --default-time-zone=+00:00
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroster", "-prosterpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: roster-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roster
      RABBITMQ_DEFAULT_PASS: rosterpass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roster-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: roster
      DB_USER: roster
      DB_PASSWORD: rosterpass
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: roster
      RABBIT_PASSWORD: rosterpass
      JWT_SECRET: "change-me-in-prod-this-must-be-at-least-32-bytes-long-hs256-key"
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql-data:
