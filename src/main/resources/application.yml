spring:
  application:
    name: roster-sync

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:roster}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC&rewriteBatchedStatements=true
    username: ${DB_USER:roster}
    password: ${DB_PASSWORD:rosterpass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: roster-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/seed
    out-of-order: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:roster}
    password: ${RABBIT_PASSWORD:rosterpass}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
      file-size-threshold: 0B

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: roster-sync

logging:
  level:
    root: INFO
    com.moveinsync.roster: INFO
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] [%X{tenantId:-}] [%X{runId:-}] %logger{36} - %msg%n"

roster:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-at-least-32-bytes-long-for-hs256-signing!!}
      access-token-ttl: 1h

  ingest:
    max-batch-size: 1000

  reconciliation:
    missing-threshold-percent: 30
    page-size: 5000
    bucket-count: 256

  outbox:
    poll-interval-ms: 500
    batch-size: 200
    max-attempts: 20
    lease-seconds: 30
    confirm-timeout-ms: 5000

  cache:
    office-ttl: 10m
    office-max-size: 10000

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:roster}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC&rewriteBatchedStatements=true
